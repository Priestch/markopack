name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run verify:example

      - run: npm run test:routes

      # `npm run build` above already produced dist/ for every workspace —
      # run the adapter script directly to avoid a redundant full rebuild.
      - run: node scripts/test-adapters.mjs
