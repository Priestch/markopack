name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run verify:example

      - run: pnpm run test:routes

      # `pnpm run build` above already produced dist/ for every workspace —
      # run the adapter script directly to avoid a redundant full rebuild.
      - run: node scripts/test-adapters.mjs
