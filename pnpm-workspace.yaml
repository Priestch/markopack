packages:
  - packages/*
  - examples/*
# 库内互依写的是发布版本区间（^0.2.x），pnpm 默认不把 workspace 包链接到
# 区间 spec 上——必须显式打开，否则 packages/rspack 解析到 pnpm store 里
# 已发布的 npm 副本，本地改动永远不生效。
linkWorkspacePackages: true
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@markopack/compiler@0.2.0 || 0.2.2'
  - '@markopack/core@0.2.0 || 0.2.2'
  - sass@1.105.2
